<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Bolão da Mega-Sena</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0a5c2f;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #ffffff;
    }

    h2 {
      text-align: center;
      color: #0a5c2f;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
    }

    .numeros {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 15px;
    }

    .numeros input {
      width: 45px;
      padding: 6px;
      font-size: 16px;
      text-align: center;
    }

    button {
      display: block;
      margin: 10px auto;
      padding: 10px 20px;
      font-size: 16px;
      background: #0a5c2f;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #0e7a3f;
    }

    .bloco {
      margin-top: 25px;
      padding: 10px;
      border-radius: 8px;
    }

    .sena   { background: #d4edda; }
    .quina  { background: #fff3cd; }
    .quadra { background: #cce5ff; }
    .todos  { background: #f4f4f4; }

    .jogo {
      padding: 6px;
      border-bottom: 1px solid #ccc;
    }

    .destaque {
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>🍀 Conferência do Bolão - Mega-Sena - 25/26</h1>

  <div class="container">

    <h2>Números Sorteados</h2>

    <div class="numeros">
      <input type="number" min="1" max="60" id="n1">
      <input type="number" min="1" max="60" id="n2">
      <input type="number" min="1" max="60" id="n3">
      <input type="number" min="1" max="60" id="n4">
      <input type="number" min="1" max="60" id="n5">
      <input type="number" min="1" max="60" id="n6">
    </div>

    <button onclick="conferirBolao()">Conferir bolão</button>

    <!-- Botão começa escondido -->
    <button id="btnTodos" onclick="toggleTodos()" style="display:none">
      Mostrar todos os jogos
    </button>

    <div id="resultado"></div>

  </div>

  <script>
    // 🔢 CADASTRE AQUI OS JOGOS
    const jogos = [
      [7,8,22,24,33,59],
	[7,8,17,33,43,44],
	[11,23,32,41,46,55],
	[8,36,52,55,56,58],
	[16,31,34,44,50,57],
	[4,10,22,28,43,47],
	[6,17,28,30,36,59],
	[6,14,17,42,44,58],
	[4,8,10,19,41,59],
	[8,18,35,36,51,57],
	[18,22,34,40,47,52],
	[4,26,32,49,53,59],
	[15,27,31,32,43,53],
	[7,23,27,35,53,57],
	[11,18,20,22,33,40],
	[6,7,28,31,44,59],
	[12,19,23,27,28,41],
	[12,15,25,29,48,59],
	[19,22,32,35,44,50],
	[9,23,26,28,34,57],
	[14,15,18,45,48,54],
	[10,13,30,38,39,50],
	[5,17,32,42,59,60],
	[8,18,33,42,44,60],
	[6,10,16,26,35,51],
	[2,20,31,37,49,56],
	[9,31,34,39,53,60],
	[14,26,31,32,42,50],
	[2,8,21,40,56,60],
	[1,2,22,46,48,51],
	[9,16,28,31,34,58],
	[7,11,13,18,29,44],
	[27,34,51,52,53,55],
	[3,19,23,24,25,48],
	[4,9,15,21,31,34],
	[13,17,21,52,54,56],
	[10,13,14,15,20,60],
	[4,6,25,30,37,49],
	[3,16,19,33,39,58],
	[4,5,18,38,45,60],
	[8,13,23,25,40,41],
	[7,13,18,31,36,42],
	[10,24,38,39,59,60],
	[1,4,39,45,46,50],
	[8,9,10,17,37,55],
	[6,15,22,24,33,48],
	[1,7,22,28,52,60],
	[6,12,22,30,42,52],
	[15,35,37,46,51,53],
	[4,8,19,34,35,59],
	[4,16,28,37,55,59],
	[33,38,42,47,49,53],
	[5,29,33,36,40,54],
	[3,14,20,22,25,29],
	[15,22,31,34,44,56],
	[9,10,20,39,40,41],
	[3,17,27,32,40,45],
	[2,12,22,23,40,46],
	[3,7,15,34,50,52],
	[8,9,19,24,30,37],
	[10,37,42,48,55,60],
	[2,21,44,49,55,59],
	[2,13,19,23,39,51],
	[8,19,28,39,45,55],
	[29,30,38,49,51,56],
	[10,35,38,39,42,53],
	[3,17,21,25,28,59],
	[9,10,17,27,49,56],
	[1,19,22,28,45,53],
	[1,17,31,44,52,55]
      // adicione seus 70 jogos
    ];

    function formatarNumero(n) {
      return String(n).padStart(2, '0');
    }

    function conferirBolao() {

      const resultado = [
        Number(n1.value),
        Number(n2.value),
        Number(n3.value),
        Number(n4.value),
        Number(n5.value),
        Number(n6.value)
      ];

      if (resultado.includes(0)) {
        alert("Preencha todos os números do sorteio!");
        return;
      }

      const semRepeticao = new Set(resultado);
      if (semRepeticao.size !== 6) {
        alert("Não é permitido repetir números!");
        return;
      }

      let qtdQuadra = 0;
      let qtdQuina = 0;
      let qtdSena = 0;

      let htmlSena = "";
      let htmlQuina = "";
      let htmlQuadra = "";

      let htmlTodos = `
        <div class="bloco todos" id="todosJogos" style="display:none">
          <h2>Todos os Jogos</h2>
      `;

      jogos.forEach((jogo, i) => {
        const acertos = jogo.filter(n => resultado.includes(n)).length;
        const jogoFormatado = jogo.map(formatarNumero).join(", ");
        const texto = `Jogo ${i + 1}: ${jogoFormatado} — ${acertos} acertos`;

        if (acertos === 4) {
          qtdQuadra++;
          htmlQuadra += `<div class="jogo">${texto}</div>`;
        }

        if (acertos === 5) {
          qtdQuina++;
          htmlQuina += `<div class="jogo">${texto}</div>`;
        }

        if (acertos === 6) {
          qtdSena++;
          htmlSena += `<div class="jogo">${texto}</div>`;
        }

        htmlTodos += `<div class="jogo ${acertos >= 4 ? 'destaque' : ''}">${texto}</div>`;
      });

      htmlTodos += "</div>";

      const blocoSena = `
        <div class="bloco sena">
          <h2>Sena (${qtdSena})</h2>
          ${htmlSena || "<p>Nenhum jogo com 6 acertos.</p>"}
        </div>
      `;

      const blocoQuina = `
        <div class="bloco quina">
          <h2>Quina (${qtdQuina})</h2>
          ${htmlQuina || "<p>Nenhum jogo com 5 acertos.</p>"}
        </div>
      `;

      const blocoQuadra = `
        <div class="bloco quadra">
          <h2>Quadra (${qtdQuadra})</h2>
          ${htmlQuadra || "<p>Nenhum jogo com 4 acertos.</p>"}
        </div>
      `;

      document.getElementById("resultado").innerHTML =
        blocoSena + blocoQuina + blocoQuadra + htmlTodos;

      // 🔓 Mostra o botão após conferir
      document.getElementById("btnTodos").style.display = "block";
      document.getElementById("btnTodos").innerText = "Mostrar todos os jogos";
    }

    function toggleTodos() {
      const div = document.getElementById("todosJogos");
      const botao = document.getElementById("btnTodos");

      if (div.style.display === "none") {
        div.style.display = "block";
        botao.innerText = "Ocultar todos os jogos";
      } else {
        div.style.display = "none";
        botao.innerText = "Mostrar todos os jogos";
      }
    }
  </script>

</body>
</html>
